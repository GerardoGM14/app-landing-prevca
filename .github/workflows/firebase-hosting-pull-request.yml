name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    paths:
      - 'landing/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-pull-request.yml'
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_PREVCA }}
          projectId: app-prevca
          target: landing
          entryPoint: ./
      - name: Publicar URL del preview en el summary
        if: steps.deploy.outputs.details_url != ''
        run: |
          echo "### Preview deploy listo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- URL del preview: ${{ steps.deploy.outputs.details_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Expira: ${{ steps.deploy.outputs.expire_time }}" >> $GITHUB_STEP_SUMMARY
