name: Deploy landing a Firebase Hosting
on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-merge.yml'

# Evita races cuando hay 2 pushes seguidos: deja terminar el último
concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Astro
        run: npm run build

      - name: Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: Escribir Service Account a archivo temporal
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_PREVCA }}' > "$RUNNER_TEMP/sa-key.json"

      - name: Deploy a Firebase Hosting (target landing)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
        run: |
          set -e
          # Capturamos la salida; si falla, revisamos si es "current active version" (no-op real)
          OUTPUT=$(firebase deploy \
            --only hosting:landing \
            --project app-prevca \
            --non-interactive 2>&1) || EXIT=$?
          echo "$OUTPUT"
          if [ "${EXIT:-0}" -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "is the current active version"; then
              echo "::notice::Sin cambios reales que desplegar — la version ya estaba activa. OK."
              exit 0
            fi
            exit "$EXIT"
          fi

      - name: Limpiar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/sa-key.json"

      - name: Publicar resumen
        if: success()
        run: |
          echo "### Deploy de landing completado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- URL principal: https://app-prevca.web.app" >> $GITHUB_STEP_SUMMARY
          echo "- Console: https://console.firebase.google.com/project/app-prevca/hosting/sites/app-prevca" >> $GITHUB_STEP_SUMMARY
