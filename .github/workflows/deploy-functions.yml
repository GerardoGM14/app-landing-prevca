name: Deploy Functions y Firestore rules
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-functions.yml'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Compilar TypeScript
        working-directory: backend
        run: npm run build

      - name: Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: Escribir Service Account a archivo temporal
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_PREVCA }}' > "$RUNNER_TEMP/sa-key.json"

      # Nota: 'storage' (las reglas de backend/storage.rules) queda fuera del CI
      # porque la service account del workflow no puede leer la config del
      # default bucket (firebasestorage.defaultBucket.get) y el deploy falla.
      # No afecta a la app: subir/leer archivos lo hace el runtime de Functions,
      # no el deploy. Si cambian las reglas, publicarlas manualmente con:
      #   firebase deploy --only storage --project app-prevca
      - name: Deploy a Firebase (Functions + Firestore)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
        run: |
          firebase deploy \
            --only functions,firestore:rules,firestore:indexes \
            --project app-prevca \
            --non-interactive \
            --force

      - name: Limpiar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/sa-key.json"

      - name: Publicar resumen
        if: success()
        run: |
          echo "### Deploy de backend completado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Cloud Functions: https://us-central1-app-prevca.cloudfunctions.net/api" >> $GITHUB_STEP_SUMMARY
          echo "- Health check: https://us-central1-app-prevca.cloudfunctions.net/api/health" >> $GITHUB_STEP_SUMMARY
          echo "- Console: https://console.firebase.google.com/project/app-prevca/functions" >> $GITHUB_STEP_SUMMARY
